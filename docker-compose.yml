services:
  graphguard-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GRAPHGUARD_MODEL: /app/artifacts/baseline/xgboost.json
      GRAPHGUARD_FEATURE_STORE: /app/artifacts/features/transaction_features.npz
      GRAPHGUARD_THRESHOLD: "0.36"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your environment}
    volumes:
      - ./artifacts/baseline:/app/artifacts/baseline:ro
      - ./artifacts/features:/app/artifacts/features:ro
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your environment}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
